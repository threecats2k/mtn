<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Minh Tam Nguyen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap");
      body {
        font-family: "Poppins", sans-serif;
      }
      .glow {
        position: absolute;
        width: 25rem;
        height: 25rem;
        border-radius: 50%;
        background: rgba(37, 99, 235, 0.1);
        filter: blur(80px);
        z-index: 0;
      }
    </style>
  </head>
  <body
    class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center overflow-hidden"
  >
    <div class="glow -top-20 -left-20"></div>
    <div class="glow bottom-0 right-0"></div>

    <div class="relative z-10 text-center px-6">
      <h1 class="text-9xl font-extrabold text-blue-600 opacity-20 mb-[-2rem]">
        404
      </h1>
      <div class="mb-8">
        <i
          class="fa-solid fa-mobile-screen text-6xl text-blue-500 mb-6 animate-bounce"
        ></i>
        <h2 class="text-3xl md:text-4xl font-bold mb-4">
          Lost in Development?
        </h2>
        <p class="text-slate-400 max-w-md mx-auto leading-relaxed">
          The page you are looking for doesn't exist or has been moved to
          another digital universe.
        </p>
      </div>

      <a
        href="/"
        class="inline-flex items-center bg-blue-600 text-white px-8 py-3 rounded-full font-semibold hover:bg-blue-500 transition shadow-lg shadow-blue-500/20"
      >
        <i class="fa-solid fa-house mr-2 text-sm"></i>
        Back to Home
      </a>
    </div>

    <footer
      class="absolute bottom-8 w-full text-center text-slate-600 text-xs uppercase tracking-widest"
    >
      Minh Tam Nguyen • Mobile Developer Freelancer
    </footer>
  </body>
</html>
